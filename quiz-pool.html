button {

button:hover { background: var(--surface-1); }

button.pick-bad { border: 2px solid var(--bad-border); background: var(--bad-bg); color: var(--bad); }

.chip.valid { background: var(--ok-bg); color: var(--ok); }
.chip.invalid { background: var(--warn-bg); color: var(--warn); }
.chip.value { background: var(--surface-1); color: var(--muted); }
.label { font-size: 13px; color: var(--muted); margin: 16px 0 4px; }

.atoms { font-size: 15px; line-height: 1.9; }
.var { font-family: var(--mono); }
.nav { justify-content: space-between; margin-top: 14px; }

  <p class="keys"><kbd>V</kbd> válido · <kbd>I</kbd> inválido · <kbd>←</kbd> <kbd>→</kbd> navegar</p>

) → ¬p)", "v": true, "l": "example (p q r : Prop) : ((q ∨ r) ∨ ¬p) → (¬(q ∨ r) → ¬p) := by grind", "m": null, "a": {"p": "Emma arrives", "q": "the cat watches the bird", "r": "the soup is hot"}, "s": "silogismo disyuntivo"}, {"t": "Either if the dog eats the apple, then the teacher eats the cake or both the teacher eats the cake and the dog eats the apple. Frank carries the letter. The teacher eats the cake. Therefore, the dog eats the apple.", "f": "((r → q) ∨ (q ∧ r)) → (p → (q → r))", "v": false, "l": "example : ¬(((False → True) ∨ (True ∧ False)) → (True → (True → False))) := by decide", "m": {"p": true, "q": true, "r": false}, "a": {"p": "Frank carries the letter", "q": "the teacher eats the cake", "r": "the dog eats the apple"}, "s": null}, {"t": "If either the train is not new or the box is open, then either the train is new or the box is open, and conversely. Either the dog does not bark or the train is new. Therefore, the dog barks if and only if the train is new.", "f": "((p → r) ↔ (p ∨ r)) → ((¬q ∨ p) → (q ↔ p))", "v": false, "l": "example : ¬(((True → True) ↔ (True ∨ True)) → ((¬False ∨ True) → (False ↔ True))) := by decide", "m": {"p": true, "q": false, "r": true}, "a": {"p": "the train is new", "q": "the dog barks", "r": "the box is open"}, "s": null}, {"t": "The doctor sleeps. If the doctor sleeps and Emma laughs, then both Frank is tired and Emma laughs. Emma laughs. Therefore, Emma laughs and Frank is tired.", "f": "q → (((q ∧ r) → (p ∧ r)) → (r → (r ∧ p)))", "v": true, "l": "example (p q r : Prop) : q → (((q ∧ r) → (p ∧ r)) → (r → (r ∧ p))) := by grind", "m": null, "a": {"p": "Frank is tired", "q": "the doctor sleeps", "r": "Emma laughs"}, "s": null}, {"t": "If the door is open, then either the dog is hungry or the bird watches the car. It is not the case that either the dog is hungry or the bird watches the car. Therefore, the door is not open.", "f": "(r → (q ∨ p)) → (¬(q ∨ p) → ¬r)", "v": true, "l": "example (p q r : Prop) : (r → (q ∨ p)) → (¬(q ∨ p) → ¬r) := by grind", "m": null, "a": {"p": "the bird watches the car", "q": "the dog is hungry", "r": "the door is open"}, "s": "modus tollens"}];
const CONFIG = {"batch": 30};
const SERVED = location.protocol.startsWith("http") && CONFIG.seed !== undefined;
// Sin servidor, la página reparte el pool en tandas de `batch` ítems.
const BATCH = SERVED ? POOL.length : CONFIG.batch || POOL.length;
const BATCHES = Math.max(1, Math.ceil(POOL.length / BATCH));
let batch = 0;
let ITEMS = POOL.slice(0, BATCH);
const answers = {};
let index = 0;
const $ = (id) => document.getElementById(id);
const label = (valid) => (valid ? "Válido" : "Inválido");

function score() {
  const done = Object.keys(answers);
  const hits = done.filter((i) => answers[i] === ITEMS[i].v).length;
  $("score").textContent = `${hits} aciertos de ${done.length} respondidas`;
}

function line(text) {
  const element = document.createElement("div");
  element.textContent = text;
  return element;
}

function show() {
  if (!ITEMS.length) {
    $("text").textContent = "El archivo no tiene ítems.";
    return;
  }
  const item = ITEMS[index];
  const answer = answers[index];
  $("pos").textContent = `${index + 1} de ${ITEMS.length}` + (answer === undefined ? "" : " · ya respondida");
  $("text").textContent = item.t;
  $("valid").className = "";
  $("invalid").className = "";
  const result = $("result");
  const detail = $("detail");
  result.replaceChildren();
  detail.replaceChildren();
  if (answer === undefined) {
    detail.append(line("Elegí una respuesta para ver el veredicto de Lean."));
    detail.firstChild.className = "label";
    return;
  }
  const hit = answer === item.v;
  $(answer ? "valid" : "invalid").className = hit ? "pick-ok" : "pick-bad";
  if (!hit) $(item.v ? "valid" : "invalid").className = "right";
  const verdict = document.createElement("span");
  verdict.className = hit ? "ok" : "bad";
  verdict.textContent = hit
    ? `Elegiste ${label(answer)}: correcto.`
    : `Elegiste ${label(answer)}: incorrecto. Es ${label(item.v)}.`;
  result.append(verdict);

  const chip = document.createElement("span");
  chip.className = "chip " + (item.v ? "valid" : "invalid");
  chip.textContent = item.v ? "Válido · Lean lo prueba con grind" : "Inválido · Lean verifica el contramodelo";
  const formula = document.createElement("pre");
  formula.textContent = item.f;
  const atoms = document.createElement("div");
  atoms.className = "atoms";
  for (const [name, text] of Object.entries(item.a)) {
    const row = document.createElement("div");
    const variable = document.createElement("span");
    variable.className = "var";
    variable.textContent = name;
    row.append(variable, ` = ${text}`);
    if (item.m && name in item.m) {
      const value = document.createElement("span");
      value.className = "chip value";
      value.textContent = item.m[name] ? "verdadero" : "falso";
      row.append(" ", value);
    }
    atoms.append(row);
  }
  const lean = document.createElement("pre");
  lean.textContent = item.l;
  const heading = (text) => Object.assign(document.createElement("p"), { className: "label", textContent: text });
  const form = document.createElement("span");
  form.className = "chip value";
  form.textContent = item.s ? `Forma: ${item.s}` : "Forma aleatoria";
  detail.append(
    chip, " ", form,
    heading("Fórmula"), formula,
    heading(item.m ? "Átomos y contramodelo (premisas verdaderas, conclusión falsa)" : "Átomos"), atoms,
    heading("Bloque de Lean"), lean,
  );
}

function pick(valid) {
  if (!ITEMS.length || answers[index] !== undefined) return;
  answers[index] = valid;
  score();
  show();
}

function go(step) {
  index = (index + step + ITEMS.length) % ITEMS.length;
  show();
}

$("valid").onclick = () => pick(true);
$("invalid").onclick = () => pick(false);
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("random").onclick = () => { index = Math.floor(Math.random() * ITEMS.length); show(); };
$("pending").onclick = () => {
  for (let step = 1; step <= ITEMS.length; step++) {
    const candidate = (index + step) % ITEMS.length;
    if (answers[candidate] === undefined) { index = candidate; show(); return; }
  }
};
function reset() {
  for (const key of Object.keys(answers)) delete answers[key];
  index = 0;
  score();
  show();
}

function note(text, error = false) {
  $("batch-note").textContent = text;
  $("batch-note").className = "batch-note" + (error ? " error" : "");
}

function describeBatch() {
  if (SERVED) note(`Tanda con semilla ${CONFIG.seed} · ${ITEMS.length} ítems`);
  else if (BATCHES > 1) note(`Tanda ${batch + 1} de ${BATCHES} · ${ITEMS.length} ítems`);
  else note(`${ITEMS.length} ítems`);
  $("more").hidden = !SERVED && BATCHES === 1;
}

let loading = false;
async function moreItems() {
  if (!SERVED) {
    batch = (batch + 1) % BATCHES;
    ITEMS = POOL.slice(batch * BATCH, (batch + 1) * BATCH);
    reset();
    describeBatch();
    return;
  }
  if (loading) return;
  loading = true;
  const seed = CONFIG.seed + 1;
  $("more").textContent = "Generando…";
  note(`Generando y verificando con Lean la tanda ${seed}…`);
  try {
    const response = await fetch(`/api/items?seed=${seed}&count=${CONFIG.count}`);
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    ITEMS = payload.items;
    CONFIG.seed = payload.seed;
    reset();
    describeBatch();
  } catch (error) {
    note(`No se pudo generar la tanda: ${error.message}`, true);
  } finally {
    loading = false;
    $("more").textContent = "Otra tanda";
  }
}

$("reset").onclick = reset;
$("more").onclick = moreItems;
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "v") pick(true);
  else if (key === "i") pick(false);
  else if (event.key === "ArrowRight") go(1);
  else if (event.key === "ArrowLeft") go(-1);
});
describeBatch();
score();
show();
</script>
